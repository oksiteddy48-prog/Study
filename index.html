:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mu:#9aa1b0;--ac:#818cf8;--ok:#4ade80;--bd:#2c303c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.sum{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:14px;margin:10px 0}
.sum label{cursor:pointer}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:10px 0;padding:0 12px}
summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none}
summary small{display:block;color:var(--mu);font-weight:400;font-size:13px}
.g{font-size:13px;color:var(--mu);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--bd)}
.it input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--ok)}
.it .b{flex:1;min-width:0}
.it.done .nm{text-decoration:line-through;color:var(--mu)}
.m{font-size:12.5px;color:var(--mu)}
.tag{display:inline-block;background:var(--bd);border-radius:6px;padding:0 6px;margin-right:6px}
a.go{flex:none;color:var(--ac);text-decoration:none;font-size:14px;border:1px solid var(--ac);border-radius:8px;padding:4px 10px}
