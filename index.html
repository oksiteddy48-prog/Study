<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Мои курсы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f1fa;--card:#fff;--tx:#1d1b3b;--mu:#6c6a8a;--line:#e3e1f2;--line2:#c9c6e4;--ac:#6b5cf6;--acs:#e9e6ff;--ok:#22b07d;--oks:#ddf5ec;--pe:#ffe9e1;--pet:#b8431d;--am:#fff1cc;--amt:#7d5600;--fill:#e1ddff;
--fd:"Unbounded","Manrope",system-ui,sans-serif;--fb:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141228;--card:#1e1b3a;--tx:#eeedfb;--mu:#a09dc4;--line:#302d55;--line2:#4a4678;--ac:#9b8fff;--acs:#2c2760;--ok:#3dd6a0;--oks:#17382f;--pe:#4a2a22;--pet:#ffb199;--am:#44370f;--amt:#f2cb6b;--fill:#2f2a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141228;--card:#1e1b3a;--tx:#eeedfb;--mu:#a09dc4;--line:#302d55;--line2:#4a4678;--ac:#9b8fff;--acs:#2c2760;--ok:#3dd6a0;--oks:#17382f;--pe:#4a2a22;--pet:#ffb199;--am:#44370f;--amt:#f2cb6b;--fill:#2f2a6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 var(--fb)}
main{max-width:880px;margin:0 auto;padding:20px 16px 48px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{display:flex;align-items:center;gap:18px;margin:6px 0 22px}
h1{font:600 24px/1.15 var(--fd);margin:0 0 6px}
.hero p{margin:0;color:var(--mu);font-size:15px}
.ring{--s:84px;--w:9px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring::before{content:"";position:absolute;inset:var(--w);border-radius:50%;background:var(--bg)}
.ring b{position:relative;font:600 17px var(--fd)}
.ring.s{--s:26px;--w:5px}.ring.s::before{background:var(--card)}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;margin-bottom:12px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px 12px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.dis{flex:none;max-width:250px;text-align:left;border:1px solid var(--line);color:var(--tx);padding:11px 15px;border-radius:16px;cursor:pointer;background:linear-gradient(90deg,var(--fill) calc(var(--p)*1%),var(--card) calc(var(--p)*1%))}
.dis b{display:block;font-size:14px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dis small{color:var(--mu);font-size:12.5px}
.dis.on{border:2px solid var(--ac);padding:10px 14px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 8px;font-weight:600}
.sum span{font-size:15px}
.sw{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:14px;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:42px;height:25px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--ac)}.sw input:checked::after{transform:translateX(17px)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
details{background:var(--card);border-radius:20px;margin:10px 0;border:1px solid var(--line)}
summary{display:flex;align-items:center;gap:12px;cursor:pointer;padding:15px 16px;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary .t{flex:1;min-width:0;line-height:1.3}
summary small{display:block;color:var(--mu);font-weight:600;font-size:13px;margin-top:2px}
summary::after{content:"";width:9px;height:9px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s;flex:none}
details[open] summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.in{padding:0 16px 8px}
.g{font-size:13px;font-weight:700;color:var(--mu);margin:10px 0 2px}
.it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.it input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border-radius:50%;border:2px solid var(--line2);background:var(--card);cursor:pointer;display:grid;place-content:center}
.it input:checked{background:var(--ok);border-color:var(--ok)}
.it input::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0)}
.it input:checked::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
.it .b{flex:1;min-width:0}
.it .nm{font-weight:600;line-height:1.35}
.it.done .nm{color:var(--mu)}
.m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:5px;font-size:13px;color:var(--mu)}
.tag{border-radius:8px;padding:2px 8px;font-weight:700;font-size:12.5px;background:var(--line);color:var(--mu)}
.tag.v{background:var(--acs);color:var(--ac)}.tag.w{background:var(--pe);color:var(--pet)}.tag.h{background:var(--am);color:var(--amt)}
a.go{flex:none;display:inline-flex;align-items:center;gap:7px;background:var(--ac);color:#fff;text-decoration:none;font-weight:700;font-size:14px;border-radius:999px;padding:8px 14px}
a.go::before{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
.it.done a.go{background:var(--acs);color:var(--ac)}.it.done a.go::before{border-left-color:var(--ac)}
@media (max-width:520px){.it{flex-wrap:wrap}.it .b{flex-basis:calc(100% - 40px)}.it a.go{margin-left:38px}}
</style></head><body><main>

<div class="seg" id="pt"></div>
<div class="row" id="yt"></div>
<div class="row" id="tabs"></div>
<div id="cs"></div><div id="tp"></div></main>

 $('yt').innerHTML=Y.map((y,i)=>`<button class="chip ${i==yi?'on':''}" onclick="yi=${i};cur=0;render()">${esc(y.name)}</button>`).join('');

 const open=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.k));
 $('tp').innerHTML=c.topics.map((t,ti)=>{
  const[x,y]=cnt(t.items);let g=null,h='';

  return `<details data-k="${k}" ${open.has(k)?'open':''}><summary><span class="ring s" style="--p:${pc(x,y)}"></span><span class="t">${esc(t.name)}<small>${x} из ${y}</small></span></summary><div class="in">${h}</div></details>`}).join('');
}
function tg(id){P[id]=!P[id];if(!P[id])delete P[id];save();render()}
